<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c48a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8601a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="drip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7b3200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a84800;stop-opacity:0.85" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#7b3200" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

  <!-- Drip drops from top -->
  <!-- Center drip -->
  <path d="M32 0 Q32 4 31 8 Q30 13 32 16 Q34 13 33 8 Q32 4 32 0Z" fill="url(#drip)" opacity="0.9" />
  <!-- Left drip -->
  <path d="M20 0 Q20 3 19.5 6 Q19 10 20.5 12 Q22 10 21.5 6 Q21 3 20 0Z" fill="url(#drip)" opacity="0.75" />
  <!-- Right drip -->
  <path d="M44 0 Q44 5 43 9 Q42 13 44 15 Q46 13 45 9 Q44 5 44 0Z" fill="url(#drip)" opacity="0.8" />

  <!-- Pink/coral band behind the S -->
  <rect x="8" y="22" width="48" height="22" rx="3" fill="#e8806a" opacity="0.45" />

  <!-- "S" letterform -->
  <text
    x="32"
    y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="700"
    font-style="italic"
    text-anchor="middle"
    fill="#c0392b"
    filter="url(#softShadow)"
    letter-spacing="-1"
  >S</text>

  <!-- Bottom highlight line -->
  <rect x="14" y="50" width="36" height="2.5" rx="1.25" fill="#ffffff" opacity="0.2" />
</svg>
